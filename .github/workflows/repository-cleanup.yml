name: One-time repository cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-cleanup.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Remove obsolete branches
        shell: bash
        run: |
          set -u
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > /tmp/branches.txt
          total=0
          deleted=0
          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            total=$((total + 1))
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
              echo "deleted branch: $branch"
            else
              failed=$((failed + 1))
              echo "could not delete branch: $branch"
            fi
          done < /tmp/branches.txt
          echo "Branches: found=$total deleted=$deleted failed=$failed" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove historical workflow runs
        shell: bash
        run: |
          set -u
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' > /tmp/runs.txt
          total=0
          deleted=0
          failed=0
          while IFS= read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            total=$((total + 1))
            if gh api -X DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
              echo "could not delete workflow run: $run_id"
            fi
          done < /tmp/runs.txt
          echo "Workflow runs: found=$total deleted=$deleted failed=$failed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report remaining repository noise
        shell: bash
        run: |
          set -u
          remaining_branches=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | grep -vx main | wc -l | tr -d ' ')
          echo "Remaining non-main branches: $remaining_branches" >> "$GITHUB_STEP_SUMMARY"
          echo "Cleanup completed without touching application code or deployments." >> "$GITHUB_STEP_SUMMARY"
