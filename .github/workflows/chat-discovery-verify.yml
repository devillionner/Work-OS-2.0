name: Chat Discovery Verify

on:
  push:
    branches:
      - work/whatsapp-chat-discovery
  pull_request:
    branches:
      - main

concurrency:
  group: chat-discovery-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: npm run verify
