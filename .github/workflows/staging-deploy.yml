name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-os-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build staging bundle
        run: npm run build

      - name: Guard staging target
        shell: bash
        run: |
          if [ "${CLOUDFLARE_ENV:-}" = "production" ]; then
            echo "Refusing to deploy with CLOUDFLARE_ENV=production"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('dist/server/wrangler.json', 'utf8'));
          const databases = Array.isArray(config.d1_databases) ? config.d1_databases : [];
          const db = databases.find((item) => item?.binding === 'DB');

          const expected = {
            worker: 'work-os-2-staging',
            database: 'work-os-2-staging-db',
            databaseId: '740312bc-bd1f-4d69-826f-d31208789598',
          };

          if (config.name !== expected.worker) {
            throw new Error(`Refusing deploy: worker is ${config.name ?? '<missing>'}, expected ${expected.worker}`);
          }
          if (!db || db.database_name !== expected.database || db.database_id !== expected.databaseId) {
            throw new Error('Refusing deploy: DB binding is not the staging D1 database');
          }
          console.log(`Guard passed: ${config.name} -> ${db.database_name}`);
          NODE

      - name: Require Cloudflare token
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing from the GitHub staging environment/repository secrets."
            exit 1
          fi

      - name: Deploy staging only
        run: npx wrangler deploy --config dist/server/wrangler.json
